<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/play/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Эхо — невидимый лабиринт. Пошли эхо, запомни стены и проведи шарик к выходу вслепую.">
  <meta name="theme-color" content="#E8F5F2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Эхо">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Эхо — невидимый лабиринт</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #E8F5F2; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #5E7C78; }
    #boot img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 28px rgba(15,168,148,.3); }
    #boot .dot { width: 8px; height: 8px; border-radius: 50%; background: #0FA894; animation: p 1.2s infinite ease-in-out; }
    @keyframes p { 0%,100% { transform: scale(.6); opacity: .4 } 50% { transform: scale(1.4); opacity: 1 } }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-192.png" alt=""><div class="dot"></div></div>
  <script>
    // Phones report a 3x screen; drawing the game at 2x is ~2x cheaper and looks the same.
    (function () {
      var r = window.devicePixelRatio || 1;
      if (r > 2) {
        try { Object.defineProperty(window, "devicePixelRatio", { get: function () { return 2; } }); } catch (e) {}
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
